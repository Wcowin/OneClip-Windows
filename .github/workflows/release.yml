name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Validate Version Matches Tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = node -p "require('./package.json').version"
          $tauriVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          $cargoToml = Get-Content -Raw -Path "src-tauri/Cargo.toml"
          $cargoVersionMatch = [regex]::Match($cargoToml, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $cargoVersionMatch.Success) {
            throw "无法读取 src-tauri/Cargo.toml 的 package.version"
          }
          $cargoVersion = $cargoVersionMatch.Groups[1].Value
          if ($packageVersion -ne $tag) {
            throw "package.json version ($packageVersion) 与 tag 版本 ($tag) 不一致"
          }
          if ($tauriVersion -ne $tag) {
            throw "tauri.conf.json version ($tauriVersion) 与 tag 版本 ($tag) 不一致"
          }
          if ($cargoVersion -ne $tag) {
            throw "Cargo.toml version ($cargoVersion) 与 tag 版本 ($tag) 不一致"
          }

      - name: Inject Updater Public Key
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY) {
            Write-Host "未配置 TAURI_UPDATER_PUBLIC_KEY，沿用仓库 tauri.conf.json 中的公钥。"
            exit 0
          }
          $path = "src-tauri/tauri.conf.json"
          $conf = Get-Content -Raw -Path $path | ConvertFrom-Json
          $conf.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
          $conf | ConvertTo-Json -Depth 100 | Set-Content -Path $path -Encoding utf8

      - name: Build Installer Bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "缺少 GitHub Secret: TAURI_SIGNING_PRIVATE_KEY"
          }
          npm run tauri:build

      - name: Generate latest.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) {
            throw "未找到 NSIS 安装包"
          }
          $sigPath = "$($nsis.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "未找到签名文件: $sigPath"
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($nsis.Name)"
          node scripts/build-updater-latest-json.mjs --version $version --url $url --signature-file $sigPath --output latest.json --notes "See GitHub release notes."
          Get-Content latest.json

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            latest.json
