version: 2
updates:
  # npm 依赖更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Cargo 依赖更新
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # glib 是 Tauri 的间接依赖，版本由 Tauri 控制
      # 等待 Tauri 官方更新
      - dependency-name: "glib"
      - dependency-name: "glib-sys"
      - dependency-name: "glib-macros"
